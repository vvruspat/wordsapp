name: Create Production Builds

jobs:
  build_android:
    type: build
    params:
      platform: android

  build_ios:
    type: build
    params:
      platform: ios
   
  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  submit_android:
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
